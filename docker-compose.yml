services:
  app:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ansim
      DATABASE_PASSWORD: ansim
      DATABASE_NAME: ansim
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./docker/db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ansim
      POSTGRES_PASSWORD: ansim
      POSTGRES_DB: ansim
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/initdb-postgis.sql:/docker-entrypoint-initdb.d/10-postgis.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ansim']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
