name: Deploy to NAS (CD)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to NAS
    runs-on: ubuntu-latest

    steps:
      - name: Connect to NAS via SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PASSWORD }}
          port: ${{ secrets.NAS_PORT }}
          script_stop: true
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            cd ${{ secrets.NAS_DEPLOY_PATH }}

            echo ".env 생성"
            echo "${{ secrets.ENV_FILE }}" > .env

            echo "GitHub main 브랜치 코드 최신화"
            git config --global --add safe.directory ${{ secrets.NAS_DEPLOY_PATH }}
            git fetch origin
            git reset --hard origin/main

            echo "Docker 이미지 빌드 및 컨테이너 재시작"
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build

            echo "배포 완료"
